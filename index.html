        <div class="text-xs text-zinc-500">当前线路共加载 {{ videos.length }} 个资源</div>
    </header>

    <div v-if="isLoading" class="flex-1 flex flex-col items-center justify-center space-y-3 py-32">

        <p class="text-xs text-zinc-500 tracking-wider">正在动态穿透并提取采集站视频流...</p>
    </div>

    <main v-else class="flex-1 p-6 max-w-7xl mx-auto w-full">

            ⚠️ 当前采集接口受防火墙拦截或暂无数据，请在上方更换其他线路尝试。
        </div>

            <div v-for="(video, index) in videos" :key="video.id"

                <div class="aspect-[3/4] w-full bg-zinc-900 relative overflow-hidden">

                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">

                </div>

                </div>
            </div>
        </div>
    </main>

    <div v-if="isPlayerOpen" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#141416] border border-zinc-800 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl flex flex-col">
            <div class="p-4 bg-[#09090b] border-b border-zinc-800 flex justify-between items-center">

            </div>
            <div class="relative aspect-video bg-black w-full">

</div>

createApp({
    setup() {
        const sites = ref(embeddedSites);
        const currentSiteKey = ref(sites.value[0].key);
        const videos = ref([]);
        const isLoading = ref(false);
        const isPlayerOpen = ref(false);
        const activeVideo = ref({});
        
        let hlsInstance = null;
        const videoPlayer = ref(null);

        // 核心：请求并解析采集源
        const fetchVideos = async () => {
            const current = sites.value.find(s => s.key === currentSiteKey.value);
            if (!current) return;
            isLoading.value = true;
            videos.value = [];

            // 完美的跨域公共反向代理，解决前端 CORS 拦截
            const proxy = "https://cors-anywhere.azm.workers.dev/?url=";
            let targetUrl = current.api;
            
            // 补全参数，直接请求详细列表
            if (!targetUrl.includes('ac=')) {
                targetUrl += (targetUrl.includes('?') ? '&' : '?') + 'ac=videolist';
            }

            try {
                const res = await fetch(proxy + encodeURIComponent(targetUrl));
                const text = await res.text();
                
                if (text.trim().startsWith('{')) {
                    parseJson(JSON.parse(text));
                } else {
                    parseXml(text);
                }
            } catch (e) {
                console.error("采集站源响应受阻，已注入通用测试流：", e);
                injectFallback();
            } finally {
                isLoading.value = false;
            }
        };

        // 处理 JSON 格式接口
        const parseJson = (data) => {
            const rawList = data.list || [];
            videos.value = rawList.map(v => {
                let pUrl = '';
                if (v.vod_play_url) {
                    const sections = v.vod_play_url.split('#');
                    pUrl = sections[0].includes('$') ? sections[0].split('$')[1] : sections[0];
                }
                return {
                    id: String(v.vod_id || Math.random()),
                    title: v.vod_name,
                    cover: v.vod_pic || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400',
                    videoUrl: pUrl
                };
            }).filter(item => item.videoUrl && (item.videoUrl.includes('.m3u8') || item.videoUrl.includes('.mp4')));
        };

        // 处理 XML 格式接口
        const parseXml = (xmlText) => {
            const xml = new DOMParser().parseFromString(xmlText, "text/xml");
            const items = xml.getElementsByTagName("video");
            const result = [];
            for (let i = 0; i < items.length; i++) {
                const el = items[i];
                const dl = el.getElementsByTagName("dl")[0];
                let pUrl = '';
                if (dl) {
                    const dd = dl.getElementsByTagName("dd")[0];
                    if (dd) {
                        const raw = dd.textContent || '';
                        pUrl = raw.split('#')[0].includes('$') ? raw.split('#')[0].split('$')[1] : raw.split('#')[0];
                    }
                }
                result.push({
                    id: el.getElementsByTagName("id")[0]?.textContent || String(Math.random()),
                    title: el.getElementsByTagName("name")[0]?.textContent || '未名影视',
                    cover: el.getElementsByTagName("pic")[0]?.textContent || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400',
                    videoUrl: pUrl
                });
            }
            videos.value = result.filter(item => item.videoUrl && (item.videoUrl.includes('.m3u8') || item.videoUrl.includes('.mp4')));
        };

        // 备用高可用流 (防止某些源突然挂掉页面空白)
        const injectFallback = () => {
            videos.value = [
                { id: 'mock_1', title: '万能测试流：大雄的宇宙开拓史 (HLS)', cover: 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400', videoUrl: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
                { id: 'mock_2', title: '万能测试流：开源大雄兔 (MP4)', cover: 'https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?w=400', videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' }
            ];
        };

        // 打开弹窗并载入视频流
        const playVideo = (video) => {
            activeVideo.value = video;
            isPlayerOpen.value = true;
            
            // 等待 DOM 渲染完毕后初始化播放内核
            Vue.nextTick(() => {
                const videoEl = videoPlayer.value;
                if (!videoEl || !video.videoUrl) return;

                if (hlsInstance) hlsInstance.destroy();

                if (video.videoUrl.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        hlsInstance = new Hls({ maxBufferLength: 10, enableWorker: true });
                        hlsInstance.loadSource(video.videoUrl);
                        hlsInstance.attachMedia(videoEl);
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(() => {}));
                    } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                        videoEl.src = video.videoUrl;
                        videoEl.addEventListener('loadedmetadata', () => videoEl.play().catch(() => {}));
                    }
                } else {
                    // MP4 播放
                    videoEl.src = video.videoUrl;
                    videoEl.load();
                    videoEl.play().catch(() => {});
                }
            });
        };

        const closePlayer = () => {
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (videoPlayer.value) { videoPlayer.value.src = ""; }
            isPlayerOpen.value = false;
        };

        const handleImgError = (e) => { e.target.src = 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400'; };

        onMounted(() => fetchVideos());

        return { sites, currentSiteKey, videos, isLoading, isPlayerOpen, activeVideo, videoPlayer, fetchVideos, playVideo, closePlayer, handleImgError };
    }
}).mount('#app');
