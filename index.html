<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamBlack - 全功能采集站聚合播放器</title>
    <meta name="referrer" content="no-referrer">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { zinc: { 950: '#09090b', 900: '#141416', 800: '#202024' } } } }
        }
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>[v-cloak] { display: none; }</style>
</head>
<body class="bg-[#09090b] text-zinc-200 font-sans antialiased">

<div id="app" class="min-h-screen flex flex-col" v-cloak>
    <header class="sticky top-0 z-40 bg-[#09090b]/95 backdrop-blur-md border-b border-zinc-800 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center space-x-4 w-full sm:w-auto">
            <span class="text-xl font-black tracking-wider text-white">STREAM<span class="text-red-500">BLACK</span></span>
            <select v-model="currentSiteKey" @change="fetchVideos" class="bg-[#141416] border border-zinc-800 text-xs text-zinc-200 px-3 py-2 rounded-xl focus:outline-none focus:border-red-500 max-w-[250px] truncate cursor-pointer">
                <option v-for="site in sites" :key="site.key" :value="site.key">{{ site.name }}</option>
            </select>
        </div>
        <div class="text-xs text-zinc-400 bg-zinc-900/50 px-3 py-1.5 rounded-lg border border-zinc-800">
            当前源成功穿透解析出 <span class="text-green-400 font-bold font-mono">{{ videos.length }}</span> 个影视资源
        </div>
    </header>

    <div v-if="isLoading" class="flex-1 flex flex-col items-center justify-center space-y-3 py-32">
        <div class="w-8 h-8 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs text-zinc-500 tracking-wider">正在通过公共代理穿透采集站数据，请稍候...</p>
    </div>

    <main v-else class="flex-1 p-6 max-w-7xl mx-auto w-full">
        <div v-if="videos.length === 0" class="text-center text-zinc-500 py-32 text-sm">
            <p class="mb-2 text-zinc-400 font-medium">⚠️ 当前采集源未返回数据，或代理通道临时拥堵。</p>
            <p class="text-xs text-zinc-600">请在左上角切换其他采集线路，或者尝试强制刷新：</p>
            <button @click="fetchVideos" class="mt-4 bg-zinc-800 text-zinc-300 px-4 py-2 rounded-lg text-xs hover:bg-zinc-700 transition">重新拉取</button>
        </div>
        
        <div v-else class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <div v-for="video in videos" :key="video.id" 
                 @click="playVideo(video)"
                 class="group relative bg-[#141416] rounded-xl overflow-hidden cursor-pointer border border-zinc-800 hover:border-zinc-600 transition-all duration-300 shadow-lg flex flex-col">
                <div class="aspect-[3/4] w-full bg-zinc-900 relative overflow-hidden">
                    <img :src="video.cover" referrerpolicy="no-referrer" class="w-full h-full object-cover transition duration-300 group-hover:scale-105" @error="handleImgError">
                    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition duration-300">
                        <div class="bg-red-500 text-white w-10 h-10 rounded-full flex items-center justify-center pl-1 shadow-md transform translate-y-2 group-hover:translate-y-0 transition duration-300">▶</div>
                    </div>
                </div>
                <div class="p-3 bg-[#141416] flex-1 flex flex-col justify-center">
                    <h3 class="text-xs font-medium text-zinc-300 group-hover:text-white line-clamp-2 leading-tight min-h-[2rem]">{{ video.title }}</h3>
                </div>
            </div>
        </div>
    </main>

    <div v-if="isPlayerOpen" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#141416] border border-zinc-800 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl flex flex-col">
            <div class="p-4 bg-[#09090b] border-b border-zinc-800 flex justify-between items-center">
                <h3 class="font-bold text-white text-sm truncate pr-4">{{ activeVideo.title }}</h3>
                <button @click="closePlayer" class="text-zinc-400 hover:text-white text-xs bg-zinc-900 px-3 py-1.5 rounded-lg border border-zinc-800 transition">✕ 关闭播放</button>
            </div>
            <div class="relative aspect-video bg-black w-full">
                <video ref="videoPlayer" class="w-full h-full" controls autoplay playsinline></video>
            </div>
            <div class="p-4 bg-[#09090b] text-[10px] text-zinc-500 font-mono truncate border-t border-zinc-800">
                当前播放源: {{ activeVideo.videoUrl }}
            </div>
        </div>
    </div>
</div>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const sites = ref([]);
        const currentSiteKey = ref('');
        const videos = ref([]);
        const isLoading = ref(false);
        const isPlayerOpen = ref(false);
        const activeVideo = ref({});
        const videoPlayer = ref(null);
        let hlsInstance = null;

        // 2026年高可用、支持高并发的公共穿透跨域代理池
        const proxies = [
            "https://api.allorigins.win/get?url=",    // 核心代理（返回封装过的 JSON）
            "https://corsproxy.io/?",                 // 备用穿透 1
            "https://thingproxy.freeboard.io/fetch/"  // 备用穿透 2
        ];

        // 1. 页面初始化，自动加载你同仓库下的 JSON 规则文件
        const loadConfig = async () => {
            isLoading.value = true;
            try {
                // 自动抓取同仓库根目录下的配置文件
                const res = await fetch('./66条采集废完再说.json');
                const config = await res.json();
                if (config && config.sites) {
                    sites.value = config.sites;
                    currentSiteKey.value = config.sites[0].key;
                    // 加载完配置后，开始获取第一个站点的视频数据
                    await fetchVideos();
                }
            } catch (e) {
                console.error("加载 66条采集废完再说.json 失败，请检查文件名或格式:", e);
                isLoading.value = false;
            }
        };

        // 2. 穿透拉取采集站数据
        const fetchVideos = async () => {
            const current = sites.value.find(s => s.key === currentSiteKey.value);
            if (!current) return;
            
            isLoading.value = true;
            videos.value = [];

            let targetUrl = current.api;
            // 规范化接口参数，强制采集站返回完整列表
            if (!targetUrl.includes('ac=')) {
                targetUrl += (targetUrl.includes('?') ? '&' : '?') + 'ac=videolist';
            }

            // 使用主跨域代理封装
            const proxyUrl = proxies[0] + encodeURIComponent(targetUrl);

            try {
                const res = await fetch(proxyUrl);
                const jsonResult = await res.json();
                const rawText = jsonResult.contents; // 解包代理返回的真实内容

                if (rawText.trim().startsWith('{')) {
                    parseJson(JSON.parse(rawText));
                } else {
                    parseXml(rawText);
                }
            } catch (e) {
                console.warn("主代理请求受限，尝试切换备用直接代理...");
                try {
                    const fallbackRes = await fetch(proxies[1] + encodeURIComponent(targetUrl));
                    const fallbackText = await fallbackRes.text();
                    if (fallbackText.trim().startsWith('{')) {
                        parseJson(JSON.parse(fallbackText));
                    } else {
                        parseXml(fallbackText);
                    }
                } catch (err2) {
                    console.error("所有公用跨域中转通道均被防火墙拦截。");
                }
            } finally {
                isLoading.value = false;
            }
        };

        // 3. 解析采集站 JSON 核心逻辑
        const parseJson = (data) => {
            const list = data.list || [];
            videos.value = list.map(v => {
                let purl = '';
                if (v.vod_play_url) {
                    const firstPart = v.vod_play_url.split('#')[0];
                    purl = firstPart.includes('$') ? firstPart.split('$')[1] : firstPart;
                }
                return {
                    id: String(v.vod_id || Math.random()),
                    title: v.vod_name,
                    cover: v.vod_pic || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400',
                    videoUrl: purl
                };
            }).filter(item => item.videoUrl && (item.videoUrl.includes('.m3u8') || item.videoUrl.includes('.mp4')));
        };

        // 4. 解析采集站 XML 核心逻辑
        const parseXml = (xmlText) => {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, "text/xml");
            const items = xml.getElementsByTagName("video");
            const result = [];
            
            for (let i = 0; i < items.length; i++) {
                const el = items[i];
                const dl = el.getElementsByTagName("dl")[0];
                let purl = '';
                if (dl) {
                    const dd = dl.getElementsByTagName("dd")[0];
                    if (dd) {
                        const raw = dd.textContent || '';
                        const firstPart = raw.split('#')[0];
                        purl = firstPart.includes('$') ? firstPart.split('$')[1] : firstPart;
                    }
                }
                result.push({
                    id: el.getElementsByTagName("id")[0]?.textContent || String(Math.random()),
                    title: el.getElementsByTagName("name")[0]?.textContent || '未知影片',
                    cover: el.getElementsByTagName("pic")[0]?.textContent || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400',
                    videoUrl: purl
                });
            }
            videos.value = result.filter(item => item.videoUrl && (item.videoUrl.includes('.m3u8') || item.videoUrl.includes('.mp4')));
        };

        // 5. 视频流内核拉起与点播播放
        const playVideo = (video) => {
            activeVideo.value = video;
            isPlayerOpen.value = true;
            
            Vue.nextTick(() => {
                const videoEl = videoPlayer.value;
                if (!videoEl || !video.videoUrl) return;

                if (hlsInstance) hlsInstance.destroy();

                if (video.videoUrl.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        hlsInstance = new Hls({ maxBufferLength: 15, maxMaxBufferLength: 30 });
                        hlsInstance.loadSource(video.videoUrl);
                        hlsInstance.attachMedia(videoEl);
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(()=>{}));
                    } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                        videoEl.src = video.videoUrl;
                        videoEl.addEventListener('loadedmetadata', () => videoEl.play().catch(()=>{}));
                    }
                } else {
                    videoEl.src = video.videoUrl;
                    videoEl.load();
                    videoEl.play().catch(()=>{});
                }
            });
        };

        const closePlayer = () => {
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (videoPlayer.value) { videoPlayer.value.src = ""; }
            isPlayerOpen.value = false;
        };

        const handleImgError = (e) => { e.target.src = 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400'; };

        // 页面入口挂载
        onMounted(() => loadConfig());

        return { sites, currentSiteKey, videos, isLoading, isPlayerOpen, activeVideo, videoPlayer, fetchVideos, playVideo, closePlayer, handleImgError };
    }
}).mount('#app');
</script>
</body>
</html>
